<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);
 // -------- //  
    ctx.fillStyle = "#281866"; //bg
    ctx.fillRect (0, 0, w, h)
    
// cat body colors
let bodyColor = "#0f0926";
let insideEar = "#3e3075";
let mouthColor = "#060314";
let whiskerColor = "#dad8e6";
let eyeColor1 = "#a85b0d";
let eyeColor2 = "#e89527";

// body
const tlHeadX = w * .2, trHeadX = w * .8 ;
const topHead = h * .3;
const midHeadX = tlHeadX + trHeadX / 2.75;
const leftBody = w * .2, rightBody = w * .8;

    ctx.beginPath();
        ctx.moveTo(w * .2, h * 1);
        ctx.lineTo(tlHeadX, topHead); //top left
        ctx.lineTo(trHeadX, topHead); //top right
        ctx.lineTo(w * .8, h * 1); 

    ctx.fillStyle = bodyColor;
    ctx.fill();

// ears
const bodyLength = (h * 1) - (h * .3);
const earLength = bodyLength / 8;
    ctx.beginPath();
        ctx.moveTo(tlHeadX, topHead);
        ctx.lineTo(tlHeadX, earLength);
        ctx.lineTo(midHeadX, topHead);
        ctx.lineTo(rightBody, earLength);
        ctx.lineTo(rightBody, topHead);
        ctx.lineTo(tlHeadX, topHead);
        
        ctx.fillStyle = bodyColor;
        ctx.fill();
        
const radius = w * 0.14;
const startAngleA = Math.PI * 0.2
const yOffset = Math.sin(startAngleA) * radius;

function drawEye(eyeX, eyeY){

    ctx.beginPath();
        ctx.arc(eyeX,
                eyeY - yOffset,
                radius,
                startAngleA,
                startAngleA + Math.PI * 0.6,
                false);

    ctx.strokeStyle = 'white';
    ctx.lineWidth = 3
    ctx.stroke();
    ctx.fillStyle = "white";
     ctx.fill()

// top eye
const startAngleB = Math.PI * 1.2

    ctx.beginPath();
        ctx.arc(eyeX,
                eyeY + yOffset,
                radius,
                startAngleB,
                startAngleB + Math.PI * 0.6,
                false);

    ctx.strokeStyle = "white";
    ctx.lineWidth = 3
    ctx.stroke();
    ctx.fillStyle = "white";
    ctx.fill()

    
}
const leftEyeX = midHeadX / 1.5, EyeY = h / 1.85;
const rightEyeX = midHeadX * 1.35;
drawEye(leftEyeX, EyeY);
drawEye(rightEyeX, EyeY);

//LEFT iris
const Iradius = w * 0.073;
const liStartAngA1 = Math.PI * 0.7
const IyOffset = Math.sin(liStartAngA1) * radius;
const liEyeX1 = leftEyeX + w / 24
const liEyeY1 = EyeY + h/12

ctx.beginPath();
ctx.arc(liEyeX1,
liEyeY1 - yOffset,
Iradius,
liStartAngA1,
liStartAngA1 + Math.PI * 0.6,
false);

let darkLeftShade = "#a85b0d";
ctx.fillStyle = darkLeftShade;
ctx.fill()

const liStartAngA2 = Math.PI * 5.7
const liEyeX2 = rightEyeX - w / 22.5
const liEyeY2 = EyeY + h/12
ctx.beginPath();
ctx.arc(liEyeX2,
liEyeY2 - yOffset,
Iradius,
liStartAngA2,
liStartAngA2 + Math.PI * 0.6,
false);

let lightLeftShade = "#e89527";
ctx.fillStyle = lightLeftShade;
ctx.fill()
//RIGHT iris
const riStartAngA1 = Math.PI * 0.7
const riEyeX1 = leftEyeX + w/2.65
const riEyeY1 = EyeY + h/12

ctx.beginPath();
ctx.arc(riEyeX1,
riEyeY1 - yOffset,
Iradius,
riStartAngA1,
riStartAngA1 + Math.PI * 0.6,
false);

let darkRightShade = "#a85b0d";
ctx.fillStyle = darkRightShade;
ctx.fill()

const riStartAngA2 = Math.PI * 5.7
const riEyeX2 = leftEyeX - w / 22.5
const riEyeY2 = EyeY + h/12
ctx.beginPath();
ctx.arc(riEyeX2,
riEyeY2 - yOffset,
Iradius,
riStartAngA2,
riStartAngA2 + Math.PI * 0.6,
false);

let lightRightShade = "#e89527";
ctx.fillStyle = lightRightShade; 
ctx.fill()
// interaction
document.addEventListener("mousemove", (e) => {
    let screenL = 300
    console.log(e.offsetX)
    const x = e.offsetX

    if(x < screenL){
        let darkRightShade = "#e89527"
        let lightRightShade = "#a85b0d"
    } else {
        let darkRightShade = "#a85b0d"
        let lightRightShade = "#e89527"
    }}) 
// happy mouth
function happyMouth(){
    const mouthAngle = Math.PI * 2
    ctx.beginPath(); //left side mouth
    ctx.arc(midHeadX / 1.21,
    h / 1.445, 
    50,
    mouthAngle,
    Math.PI, 
    false);
    
    ctx.strokeStyle = "#403869";
    ctx.lineWidth = 4;
     ctx.stroke();
 
 ctx.beginPath(); //right side mouth
     ctx.arc(midHeadX * 1.17,
         h / 1.445, 
         50,
         mouthAngle,
         Math.PI, 
         false);
 
     ctx.strokeStyle = "#403869";
     ctx.lineWidth = 4;
     ctx.stroke();
 }
 // mad mouth
function madMouth(){
 ctx.beginPath(); //left side
     ctx.moveTo(midHeadX, h / 1.46)
     ctx.lineTo(midHeadX / 1.5, h / 1.2)
     ctx.strokeStyle = "#403869"
     ctx.lineWidth = 3
     ctx.stroke();
  
 ctx.beginPath(); //right side
     ctx.moveTo(midHeadX, h / 1.46)
     ctx.lineTo(midHeadX * 1.31, h / 1.2)
     ctx.strokeStyle = "#403869"
     ctx.lineWidth = 3
     ctx.stroke();
}
 // nose
    ctx.beginPath()
    ctx.arc(
        midHeadX,
        h / 1.5, 
        15,
        Math.PI * 2, 
        false);

        ctx.fillStyle = "pink";
        ctx.fill();
        ctx.strokeStyle = "#ff8298";
        ctx.lineWidth = 3
        ctx.stroke();

// whisker funct
function drawWhisk(whiskCX, whiskCY, isLeft){
const scaleStart = isLeft ? 10 : 5
        const scaleEnd = !isLeft ? 10 : 5

        for(let i = 0; i < 3; i++){
            let j = i - 1;

            ctx.beginPath()
            ctx.moveTo(whiskCX - w/9, whiskCY + j * scaleStart)
            ctx.lineTo(whiskCX + w/9, whiskCY + j * scaleEnd)
            ctx.strokeStyle = "white"
            ctx.lineWidth = 2
            ctx.stroke();
        }
    }
drawWhisk(leftBody, midHeadX + w/4, true)
drawWhisk(rightBody, midHeadX + w/4, false)
happyMouth()
</script>
