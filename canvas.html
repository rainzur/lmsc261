<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

    ctx.fillStyle = "lightblue";
    ctx.fillRect(0,0, w, h);

    let xPos = 394;
    let yPos = Math.random() * h;
    let radius = 90;

    //rainbow parts;
    let colors = ["red", "orange", "yellow", "green",
     "blue", "indigo", "violet"]

    for(let i = 0; i < 7; i++){
        let xPos = 300;
        let yPos = 300;
        let radius = 125 + (i + 1) * 20;
        
        ctx.beginPath();
        ctx.arc(xPos,
                yPos,
                radius,
                0,
                Math.PI,
                true);

        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.strokeStyle = colors[6 - i];
        ctx.stroke();
}

    
</script>
