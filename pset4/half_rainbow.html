<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);


ctx.fillStyle = "#f2edeb"
ctx.fillRect(0, 0, w, h)

let numCircles = prompt("How many circles?");

  let colors = ["red", "orange", "yellow", 
                "green", "blue", "indigo", "violet"];

    for(let i = 0; i < numCircles; i++){
        let xPos = 300;
        let yPos = 300;
        let radius = 125 + (i + 1) * 20;

        let startAngle = Math.PI * 1.25;
        let endAngle = startAngle + Math.PI * 0.75;
        ctx.beginPath();
        ctx.arc(xPos,
                yPos,
                radius,
                startAngle,  // 3 PM
                endAngle, 
                false);

        ctx.lineWidth = Math.random() * 10;
        ctx.lineCap = "round";
        ctx.strokeStyle = colors[6 - i];
        ctx.stroke();
    }
    

</script>
