<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

ctx.fillStyle = "#281866"
ctx.fillRect(0, 0, w, h)
  for(let c = 1; c <= 256; c++){
        let xPos = Math.random() * w;
        let yPos = Math.random() * h;
        let radius = (Math.random() * 5) + 0.6;

        ctx.beginPath();
        ctx.arc(xPos,
                yPos,
                radius,
                0,
                Math.PI * 2,
                true);
        
        let isAbove = yPos < 300
        
        if(isAbove){
            ctx.fillStyle = "#d11994";
            ctx.strokeStyle = "#ff99dd";
            ctx.lineWidth = 3;
            ctx.stroke();
        } else {
            ctx.fillStyle = "#7280db"
            ctx.strokeStyle = "#31128a";
            ctx.lineWidth = 3;
            ctx.stroke();
        }
        ctx.fill();
  }
    

</script>
